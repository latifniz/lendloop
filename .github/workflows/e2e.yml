name: E2E (browser)

# Manual on purpose: it signs up throwaway members through Clerk testing tokens and writes to the
# Convex deployment behind the target URL, so point it at a dev/staging deployment, not production data.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL of the running app to test (a preview or staging deployment)"
        required: true
      n8n_url:
        description: "Optional n8n base URL for the health/unsigned-webhook check"
        required: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: ${{ inputs.base_url }}
      E2E_N8N_URL: ${{ inputs.n8n_url }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: |
          if [ -z "$CLERK_SECRET_KEY" ]; then echo "::error::Add the CLERK_SECRET_KEY and NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY repository secrets (Clerk development instance)."; exit 1; fi
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report/, retention-days: 7 }
